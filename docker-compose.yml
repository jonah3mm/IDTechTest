services:
  backend:
    image: python:3.11-slim
    command: sh -c "pip install -q -r requirements.txt && python run.py"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      NETTRACK_DATABASE_URL: sqlite:////app/nettrack.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/clients')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    image: node:18-alpine
    working_dir: /frontend
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_TARGET: http://backend:5000
    volumes:
      - ./frontend:/frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
